name: docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  docs:
    name: "Build and deploy docs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[docs]'

      # -W turns warnings into errors. Without it this step published a
      # site with 28 broken cross-references and reported success: myst
      # generated no heading anchors at all, so every
      # `[text](page.md#heading)` link in the docs resolved to nothing,
      # and several links pointed at files that had been renamed away.
      # A docs build that cannot fail is not a check.
      - name: Build
        id: build
        run: |
          cd docs
          sphinx-build -b html -W --keep-going . _build/html
          touch _build/html/.nojekyll

      - name: Publish
        uses: JamesIves/github-pages-deploy-action@v4
        if: steps.build.outcome == 'success' && github.event_name == 'push'
        with:
          branch: gh-pages
          folder: docs/_build/html

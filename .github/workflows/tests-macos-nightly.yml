name: tests-macos-nightly

# The full macOS unit matrix, once a night when main has changed.
#
# tests-macos.yml runs both macOS versions on only the two Pythons that
# bracket the range (3.9 and 3.14), because macOS runners queue for
# hours. This lane runs the whole 2 x 6 product, so the eight cells the
# pull-request lane leaves out are exercised within a day of a merge
# instead of never.
#
# A night whose main is the commit the last completed night already
# tested runs nothing: the same code on the same runners answers the
# same way, and twelve macOS jobs is the queue pressure this lane
# exists to relieve. A manual run always runs.
#
# It is neither a merge gate nor a publisher. Its job names start with
# `nightly:` on purpose: the ruleset matches required checks by name, so
# a name that cannot be mistaken for a `unit:` check keeps anyone from
# adding a lane that never reports on a pull request to the required
# set, which would block every merge on a check that cannot arrive.
# It is deliberately not wired to any release gate (maintainer ruling,
# 2026-10-03); a red night is a signal to read, not a block.
#
# No `push: [main]`: testEveryWorkflowIsClassifiedOrDeliberatelyScheduled
# forbids an event-driven lane outside the pre/post-merge split, and a
# twelve-job macOS run on every merge is the queue pressure this lane
# exists to relieve.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A nightly result is something somebody wants, never a draft to be
# replaced, so a newer run waits instead of cancelling an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Deliberately unnamed: a `name` would join the check names
  # testTheNightlyMacosMatrixCoversWhatThePullRequestLeavesOut compares
  # with the pull-request product, and this job is no cell of it.
  has-main-changed:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      bRun: ${{ steps.compare.outputs.bRun }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "bRun=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The last night that ran to a verdict, pass or fail. A
          # cancelled night tested nothing, so it does not count.
          sLastTested=$(gh run list --repo "${{ github.repository }}" \
            --workflow tests-macos-nightly.yml --branch main \
            --event schedule --status completed --limit 20 \
            --json headSha,conclusion \
            --jq '[.[] | select(.conclusion != "cancelled")][0].headSha // ""')
          if [ "$sLastTested" = "${{ github.sha }}" ]; then
            echo "main is still ${{ github.sha }}, which the last night tested; nothing to run."
            echo "bRun=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved since the last night (${sLastTested:-none}); running."
            echo "bRun=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: has-main-changed
    if: needs.has-main-changed.outputs.bRun == 'true'
    name: 'nightly:${{ matrix.os }}:python-${{ matrix.python-version }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install the shells the completion tests drive
        # TESTING ONLY, and the same step as tests-macos.yml; see there.
        timeout-minutes: 10
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install fish
          fish --version
          zsh --version

      - name: Run tests
        # The same ceiling and the same selection as tests-macos.yml, so
        # a night's result is comparable with a pull request's.
        timeout-minutes: 50
        env:
          VAIBIFY_REQUIRE_SHELLS: '1'
        run: |
          python -m pytest tests/ -m "not docker and not docker_live and not browser" --tb=short -v --junitxml=junit/test-results.xml --cov --cov-report=xml --cov-report=term

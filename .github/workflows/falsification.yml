# Named, badged check for the architectural-invariant and falsification
# suites, plus the standing "re-kill" harness.
#
# The full 24-cell matrix coverage of the invariant/falsification *tests*
# already comes from tests-linux.yml and tests-macos.yml, which collect
# them via `pytest tests/`. This workflow deliberately does NOT duplicate
# that. Its purpose is twofold:
#   1. Give the invariant + falsification suites a dedicated, named,
#      badgeable check that is easy to point at.
#   2. Run tools/reconfirmFalsification.py — the standing negative
#      control that re-applies each recorded mutation and confirms the
#      guarding test still FAILS (the "kill"). A nonzero exit means a
#      guard is no longer defended and MUST fail the job.
#
# The harness result is OS/Python-independent, so this runs on a
# representative subset (min/max Python on one Linux + one macOS) rather
# than the full matrix. README badges are owned by the Badge phase; this
# workflow does not touch README.

name: falsification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  falsification:
    # Named exactly like the tests-linux / tests-macos matrix legs, this
    # lane produced check names such as `ubuntu-24.04:python-3.14` that
    # a second workflow also produced. Requiring that name is then
    # satisfied by whichever lane reports it, so the two are not
    # independently requireable — and searching "falsification" in the
    # required-checks picker returns nothing at all.
    name: 'falsification:${{ matrix.os }}:python-${{ matrix.python-version }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        python-version: ["3.9", "3.14"]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Architectural invariants
        timeout-minutes: 15
        run: |
          python -m pytest tests/testArchitecturalInvariants.py -v

      - name: Falsification tests
        timeout-minutes: 15
        run: |
          python -m pytest -m falsification -v

      - name: Re-confirm falsification kills
        # 25 -> 60 on 2026-08-07. The step timed out rather than finding
        # a surviving mutant: the registry grew 412 -> 559 entries during
        # the carrier migration, and every entry applies a mutation and
        # runs a pytest node. Measured locally at ~1.9s per entry, so
        # ~18 minutes here and roughly double that on a hosted runner.
        #
        # This is a capacity limit that will be reached again -- it
        # scales with the registry, which only grows. When it next
        # trips, RAISE it again or shard the registry across matrix
        # legs. Do NOT reach for `-n auto`: this harness mutates source
        # in place, and AGENTS.md records what happened when a
        # source-mutating tool shared a working tree -- failures in
        # tests nobody had touched, twice misdiagnosed as flakiness.
        #
        # 60 -> 90 on 2026-08-12, and it tripped exactly as predicted
        # above. The registry reached 752 entries; the ubuntu-3.14 leg
        # printed "721/721 kill-confirmed" and was then killed about
        # two minutes past the ceiling, so the work had FINISHED and
        # the red said nothing about the code. That leg is the slowest
        # of the four because it evaluates the docker_live entries the
        # macOS runners defer AND runs roughly 35% slower than the 3.9
        # leg beside it (47m).
        #
        # Raising is the symptom's fix, chosen deliberately over
        # sharding so one leg still re-confirms the WHOLE registry --
        # a sharded leg proves a quarter of it, and the standing
        # negative control is the thing worth keeping. The cause is
        # that entries are replayed serially, one worktree at a time;
        # the durable fix is N workers with one disposable worktree
        # each, which preserves the isolation discipline the comment
        # above is about. Measure before doing it.
        timeout-minutes: 90
        env:
          # The Linux runners ship a Docker daemon, so they are where
          # the real-container entries are actually judged. Demanding
          # the daemon here means losing it turns this lane RED rather
          # than silently shrinking the denominator it reports against.
          # The macOS runners have no daemon and cannot get one, so
          # they defer those entries by name instead.
          VAIBIFY_REQUIRE_DOCKER_DAEMON: >-
            ${{ startsWith(matrix.os, 'ubuntu') && '1' || '' }}
        run: |
          python tools/reconfirmFalsification.py

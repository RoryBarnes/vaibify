name: tests-macos

on:
  # NO base-branch filter, deliberately. These gates were declared
  # `branches: [main]`, so a pull request based on another branch --
  # a stacked PR, which is how a large feature gets reviewed in
  # pieces -- triggered NONE of them and reported "no checks" rather
  # than failing. That reads almost exactly like "all checks passed"
  # on a PR page, and it hid an entire feature branch from CI on
  # 2026-08-18. A gate that does not run is worse than a gate that
  # fails, because only one of them says so.
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: 'unit:${{ matrix.os }}:python-${{ matrix.python-version }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        timeout-minutes: 25
        run: |
          python -m pytest tests/ -m "not docker and not docker_live and not browser" --tb=short -v --junitxml=junit/test-results.xml --cov --cov-report=xml --cov-report=term

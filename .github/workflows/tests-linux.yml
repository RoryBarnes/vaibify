name: tests-linux

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  checks: write
  pull-requests: write

jobs:
  tests:
    name: '${{ matrix.os }}:python-${{ matrix.python-version }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        timeout-minutes: 15
        run: |
          python -m pytest tests/ -m "not docker and not docker_live and not browser" --tb=short -v --junitxml=junit/test-results.xml --cov --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.9'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          name: ${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: junit/test-*.xml
          check_name: Test Results (${{ matrix.os }} py${{ matrix.python-version }})

  # Live-daemon coverage, deliberately its own job rather than a step
  # inside the matrix above.
  #
  # This used to be an inline step guarded by `docker info || exit 0`,
  # which reported SUCCESS when no daemon was reachable -- a job
  # advertised as live-Docker coverage going green for having run
  # nothing. That is the same defect class as a dashboard that hides
  # an error, and it is why the guard is gone.
  #
  # Splitting it out is what makes failing honest affordable: a
  # transient daemon problem fails this one job instead of all twelve
  # matrix cells. The ordinary matrix stays Docker-free.
  docker-smoke:
    name: 'docker-smoke (live daemon)'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Wait for the Docker daemon
        run: |
          for iAttempt in 1 2 3 4 5; do
            if docker info >/dev/null 2>&1; then
              echo "docker daemon reachable on attempt ${iAttempt}"
              exit 0
            fi
            echo "daemon not reachable (${iAttempt}/5); retrying in 5s"
            sleep 5
          done
          echo "::error::Docker daemon unreachable after 5 attempts."
          exit 1

      - name: Run live-daemon smoke tests
        timeout-minutes: 5
        env:
          # Turns the tests' own convenience skip into a failure, so a
          # green result here cannot mean "skipped everything".
          VAIBIFY_REQUIRE_DOCKER_DAEMON: '1'
        run: |
          python -m pytest tests/ -m docker_live --tb=short -v

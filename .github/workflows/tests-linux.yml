name: tests-linux

on:
  # NO base-branch filter, deliberately. These gates were declared
  # `branches: [main]`, so a pull request based on another branch --
  # a stacked PR, which is how a large feature gets reviewed in
  # pieces -- triggered NONE of them and reported "no checks" rather
  # than failing. That reads almost exactly like "all checks passed"
  # on a PR page, and it hid an entire feature branch from CI on
  # 2026-08-18. A gate that does not run is worse than a gate that
  # fails, because only one of them says so.
  pull_request:
  workflow_dispatch:

permissions:
  # `contents: read` is not optional: an explicit permissions block
  # REPLACES the defaults, so omitting it left the token unable to check
  # out a private repository. This lane could not run at all from the day
  # the repo went private until 2026-08-07, and a red X reading "checkout
  # failed" looks like infrastructure noise rather than absent coverage --
  # two test files landed behind it and had never once run on Linux.
  contents: read
  checks: write
  pull-requests: write

# Supersede, do not pile up. Every push to an open pull request used to
# queue another full matrix behind the last one, and nothing cancelled
# the run it had just made irrelevant. On the macOS legs -- the
# scarcest runners and the widest matrix -- that meant twelve unit jobs
# sitting at QUEUED for two hours while a superseded run from the
# previous push held the machines (2026-09-21).
#
# Keyed on the PULL REQUEST, so two different PRs never contend, and
# cancelling is switched off for anything that is not a pull request:
# a push to main and a manual dispatch are results somebody wants, not
# drafts to be replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: 'unit:${{ matrix.os }}:python-${{ matrix.python-version }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install the shells the completion tests drive
        # TESTING ONLY. The shell-completion tests drive the real shells,
        # and a test that skips when its shell is missing reports success
        # for having tested nothing, so the shells are installed here and
        # the run below demands them (VAIBIFY_REQUIRE_SHELLS). Nothing
        # installed here is a dependency of vaibify.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fish zsh
          fish --version
          zsh --version

      - name: Run tests
        # RAISED from 25 (2026-09-08), for the reason on the macOS leg: these
        # measure 20-22 minutes median and 25 max (6 runs) -- the max WAS the
        # ceiling. Raised in step so the two lanes stay comparable.
        timeout-minutes: 50
        env:
          VAIBIFY_REQUIRE_SHELLS: '1'
        run: |
          python -m pytest tests/ -m "not docker and not docker_live and not browser" --tb=short -v --junitxml=junit/test-results.xml --cov --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        # The upload is a report, never a gate: `fail_ci_if_error: false`
        # below says so, but the action's Node process can die BEFORE it
        # reaches that setting (2026-10-05: a TLS handshake failure
        # fetching the uploader failed this step on three runs in a row
        # while every test passed). The step is therefore non-fatal, and
        # its failure stays visible as an annotation on the run.
        continue-on-error: true
        if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.9'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          name: ${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: junit/test-*.xml
          check_name: results:${{ matrix.os }}:python-${{ matrix.python-version }}

  # Live-daemon coverage, deliberately its own job rather than a step
  # inside the matrix above.
  #
  # This used to be an inline step guarded by `docker info || exit 0`,
  # which reported SUCCESS when no daemon was reachable -- a job
  # advertised as live-Docker coverage going green for having run
  # nothing. That is the same defect class as a dashboard that hides
  # an error, and it is why the guard is gone.
  #
  # The architectural invariants already run inside every matrix leg,
  # so this job adds no coverage. What it adds is a NAME: a required
  # check called `invariants` that a reviewer can see, and that fails
  # on its own line instead of somewhere inside a twelve-cell matrix.
  # It costs about ten seconds.
  invariants:
    name: 'invariants'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the architectural invariants
        run: python -m pytest tests/testArchitecturalInvariants.py -q

  # A NAMED check for the error-grade static analysis (pyflakes and
  # `pylint --errors-only`). The same test runs inside every matrix leg;
  # this job adds the name, so that a required check called `lint` fails
  # on its own line, and so that dropping a marker filter from the matrix
  # cannot silently remove it. A single interpreter is enough: the
  # findings were measured identical on Python 3.9 and 3.13. It costs a
  # few minutes, almost all of it pylint.
  lint:
    name: 'lint'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pyflakes and pylint errors against the seeds
        timeout-minutes: 10
        run: python -m pytest tests/testStaticAnalysisClean.py -q

  # Splitting it out is what makes failing honest affordable: a
  # transient daemon problem fails this one job instead of all twelve
  # matrix cells. The ordinary matrix stays Docker-free.
  docker-smoke:
    name: 'docker-smoke'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Wait for the Docker daemon
        run: |
          for iAttempt in 1 2 3 4 5; do
            if docker info >/dev/null 2>&1; then
              echo "docker daemon reachable on attempt ${iAttempt}"
              exit 0
            fi
            echo "daemon not reachable (${iAttempt}/5); retrying in 5s"
            sleep 5
          done
          echo "::error::Docker daemon unreachable after 5 attempts."
          exit 1

      - name: Run live-daemon smoke tests
        # The live tests themselves take about five minutes (296-303 s
        # measured), so a five-minute cap killed passing runs. RAISED
        # from 10 (2026-10-05): the reader-journey test adds about 21 s
        # and the job then ran out at the finish line twice with every
        # test green.
        timeout-minutes: 15
        env:
          # Turns the tests' own convenience skip into a failure, so a
          # green result here cannot mean "skipped everything".
          VAIBIFY_REQUIRE_DOCKER_DAEMON: '1'
        run: |
          python -m pytest tests/ -m docker_live --tb=short -v

name: badges

# Dynamic, secret-free count badges.
#
# Computes four test counts by collecting the run-selection of the suite
# (the same tests the unit-test workflows actually execute), writes
# one shields.io ENDPOINT json per count, and publishes them to a dedicated
# orphan `badges` branch using the built-in GITHUB_TOKEN. The README points
# shields.io at the raw json on that branch, so the badges update whenever
# this workflow runs on main. No PAT, no gist, no secret storage.
#
# The `badges` branch holds ONLY the generated json — never source, never a
# merge target. main is never committed to.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # Read-only, and only to resolve which checks gated the merge that
  # produced this commit: the PR behind it, and that PR's workflow runs.
  actions: read
  pull-requests: read

jobs:
  publish-badges:
    name: compute and publish count badges
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compute counts
        id: counts
        run: |
          # Count only tests that actually run in CI: the same selection the
          # unit-test workflows grade (`-m "not docker and not docker_live"`),
          # so the badge never counts container tests that skip without a
          # live daemon.
          iTotal=$(python -m pytest tests/ -m "not docker and not docker_live" --collect-only -q -p no:cacheprovider | grep -c "::")
          iFalsification=$(python -m pytest -m falsification --collect-only -q -p no:cacheprovider | grep -c "::")
          iInvariants=$(python -m pytest tests/testArchitecturalInvariants.py --collect-only -q -p no:cacheprovider | grep -c "::")
          # The browser lane's tests skip at fixture time when Playwright
          # is absent, so they still COLLECT here without the browser
          # extra installed — the count is the lane's real size.
          iBrowser=$(python -m pytest tests/browser -m browser --collect-only -q -p no:cacheprovider | grep -c "::")
          # A count of zero is never a true answer for this repo: it
          # means the selection stopped matching (a renamed marker, a
          # moved directory) and the badge would publish "0 tests" as
          # fact. Fail loudly instead of shipping a confident lie.
          for sPair in "total:$iTotal" "falsification:$iFalsification" \
                       "invariants:$iInvariants" "browser:$iBrowser"; do
            if [ "${sPair#*:}" -eq 0 ]; then
              echo "::error::${sPair%%:*} collected 0 tests; refusing to publish a badge that would misstate it"
              exit 1
            fi
          done
          echo "iTotal=$iTotal" >> "$GITHUB_OUTPUT"
          echo "iFalsification=$iFalsification" >> "$GITHUB_OUTPUT"
          echo "iInvariants=$iInvariants" >> "$GITHUB_OUTPUT"
          echo "iBrowser=$iBrowser" >> "$GITHUB_OUTPUT"
          echo "collected total=$iTotal falsification=$iFalsification invariants=$iInvariants browser=$iBrowser"

      - name: Write shields.io endpoint json
        run: |
          mkdir -p badgeOutput
          python - "${{ steps.counts.outputs.iTotal }}" \
                   "${{ steps.counts.outputs.iFalsification }}" \
                   "${{ steps.counts.outputs.iInvariants }}" \
                   "${{ steps.counts.outputs.iBrowser }}" <<'PY'
          import json
          import sys

          iTotal, iFalsification, iInvariants, iBrowser = (
              int(sValue) for sValue in sys.argv[1:5]
          )

          def fnWriteEndpoint(sFileName, sLabel, iCount, sColor):
              dictEndpoint = {
                  "schemaVersion": 1,
                  "label": sLabel,
                  "message": f"{iCount:,}",
                  "color": sColor,
              }
              with open(f"badgeOutput/{sFileName}", "w", encoding="utf-8") as fileHandle:
                  json.dump(dictEndpoint, fileHandle)
                  fileHandle.write("\n")

          fnWriteEndpoint("tests.json", "unit tests", iTotal, "darkblue")
          fnWriteEndpoint("falsification.json", "falsification tests", iFalsification, "brightgreen")
          fnWriteEndpoint("invariants.json", "architectural invariants", iInvariants, "blueviolet")
          fnWriteEndpoint("browser.json", "browser tests", iBrowser, "teal")
          PY
          cat badgeOutput/*.json

      - name: Resolve the checks that gated this merge
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A status badge should describe main, not whatever ran most
          # recently on somebody's branch — GitHub's own workflow badges
          # show the latest run on ANY branch, so a contributor's failing
          # pull request reddens them while main is fine.
          #
          # The merge-gate lanes no longer run on main at all, so there is
          # nothing on this commit to read. What there IS: the pull request
          # this merge commit came from, whose checks are exactly the ones
          # that decided the merge was allowed. Resolve those instead of
          # re-running anything.
          sPrHead=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                    -q '.[0].head.sha // empty')
          if [ -z "$sPrHead" ]; then
            # A direct push, not a merge. Leave the existing badges alone:
            # they still correctly describe the last *merge*, and blanking
            # them would report an absence of information as a change of
            # state.
            echo "no pull request produced ${GITHUB_SHA}; keeping the previous merge-status badges"
            echo "bResolved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Deliberately outside the checkout. Written into the worktree
          # it is one glob away from being published: the first run of
          # this step put a 70 kB API dump on the badges branch, which
          # is supposed to hold only the generated json.
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sPrHead}&per_page=100" \
            > "${RUNNER_TEMP}/gateRuns.json"
          echo "bResolved=true" >> "$GITHUB_OUTPUT"
          echo "resolved gating checks from PR head ${sPrHead}"

      - name: Write merge-status endpoint json
        if: steps.gate.outputs.bResolved == 'true'
        run: |
          python - <<'PY'
          import json

          # Workflow name as GitHub reports it -> badge file. Only the
          # lanes that gate a merge belong here; docs, badges and
          # pip-install run on main or on a release, so their built-in
          # GitHub badges already describe the right thing.
          DICT_MERGE_GATE_LANES = {
              "tests-linux": "statusTestsLinux.json",
              "tests-macos": "statusTestsMacos.json",
              "falsification": "statusFalsification.json",
              "browser": "statusBrowser.json",
              "agent-docs-path-check": "statusAgentDocs.json",
          }

          # A lane with no run against the merged pull request did not
          # gate it. That is not a pass and must never render as one.
          DICT_CONCLUSION_STYLE = {
              "success": ("passing", "brightgreen"),
              "failure": ("failing", "red"),
              "timed_out": ("timed out", "red"),
              "cancelled": ("cancelled", "lightgrey"),
              "skipped": ("skipped", "lightgrey"),
              "": ("did not run", "lightgrey"),
          }

          import os

          sRunsPath = os.path.join(os.environ["RUNNER_TEMP"], "gateRuns.json")
          with open(sRunsPath, encoding="utf-8") as fileHandle:
              listRuns = json.load(fileHandle).get("workflow_runs", [])

          dictLatestByName = {}
          for dictRun in listRuns:
              sName = dictRun.get("name", "")
              dictPrevious = dictLatestByName.get(sName)
              if (dictPrevious is None
                      or dictRun.get("created_at", "")
                      > dictPrevious.get("created_at", "")):
                  dictLatestByName[sName] = dictRun

          for sWorkflow, sFileName in DICT_MERGE_GATE_LANES.items():
              dictRun = dictLatestByName.get(sWorkflow) or {}
              sConclusion = dictRun.get("conclusion") or ""
              sMessage, sColor = DICT_CONCLUSION_STYLE.get(
                  sConclusion, (sConclusion, "lightgrey"),
              )
              with open(f"badgeOutput/{sFileName}", "w",
                        encoding="utf-8") as fileHandle:
                  json.dump({
                      "schemaVersion": 1,
                      "label": sWorkflow,
                      "message": sMessage,
                      "color": sColor,
                  }, fileHandle)
                  fileHandle.write("\n")
              print(f"{sWorkflow}: {sMessage}")
          PY

      - name: Publish to orphan badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Installing the package for the collect step lets setuptools-scm
          # restamp the tracked vaibify/_version.py, leaving the tree dirty and
          # blocking the branch switch below. Discard that churn; the badge
          # json we publish lives in untracked badgeOutput/, which a
          # tracked-file restore leaves untouched.
          git checkout -- . 2>/dev/null || true
          git fetch origin badges || true
          if git show-ref --quiet refs/remotes/origin/badges; then
            git checkout badges
            git pull --ff-only origin badges || true
          else
            git checkout --orphan badges
            git rm -rf . >/dev/null 2>&1 || true
          fi
          # Publish by NAME, never by glob. A glob here is what put a raw
          # API dump on this branch; an explicit list can only ever
          # publish a badge. Status files are absent on a direct push
          # (see the gate step), so each is copied only if it exists and
          # the previous one is left in place.
          for sBadge in tests.json falsification.json invariants.json \
                        browser.json statusTestsLinux.json \
                        statusTestsMacos.json statusFalsification.json \
                        statusBrowser.json statusAgentDocs.json; do
            if [ -f "badgeOutput/$sBadge" ]; then
              cp "badgeOutput/$sBadge" .
              git add "$sBadge"
            fi
          done
          # Self-heal the branch: remove anything a previous run stranded
          # here that is not a badge.
          git rm -q --ignore-unmatch gateRuns.json
          if git diff --cached --quiet; then
            echo "badge json unchanged - nothing to publish"
            exit 0
          fi
          git commit -m "chore(badges): refresh test count badges"
          git push origin badges

name: pip-install

# Post-merge by decision (2026-07-28): the pre-merge gate is the test
# suites, and distributions are built after a merge rather than on every
# pull request.
#
# Know what that costs. The artifact checks originally ran only on
# `release: published` -- after the release existed -- and were moved
# onto the PR gate because a wheel containing no templates had shipped
# and `import vaibify` could not see it. Running here means a packaging
# regression reaches `main` and is caught on the push, not held out by
# the merge gate: the signal arrives minutes later and on the shared
# branch instead of the contributor's. It is still caught before a
# release, which is what upload_pypi depends on.
#
# So a red pip-install on `main` is not "flaky CI" -- it means `main`
# currently produces a broken distribution and needs a fix commit.
on:
  release:
    types:
      - published
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.11'

      - name: Build
        run: |
          python -m pip install -U pip build twine setuptools setuptools_scm wheel
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  test:
    name: 'Test py${{ matrix.python }} on ${{ matrix.os }}'
    needs: [build]
    runs-on: ${{ matrix.os }}
    # A release checks the full support matrix. A push to main checks
    # the corners — oldest and newest supported Python, one Linux and
    # one macOS — because 24 jobs per merge to catch a packaging mistake
    # that is almost never platform-specific is the wrong trade. The
    # failure this gate exists for (a wheel with no package data) is
    # identical on every row.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'release'
          && fromJSON('["macos-15","macos-26","ubuntu-22.04","ubuntu-24.04"]')
          || fromJSON('["ubuntu-24.04","macos-26"]') }}
        python: ${{ github.event_name == 'release'
          && fromJSON('["3.9","3.10","3.11","3.12","3.13","3.14"]')
          || fromJSON('["3.9","3.14"]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      # An import is not a smoke test. Until 2026-07-27 these two steps
      # ran `import vaibify` and nothing else, so every release passed
      # while shipping a wheel with no templates and no Docker build
      # context -- `vaibify init` printed "No templates found" and
      # exited 0. checkInstalledDistribution.py drives the first-run
      # paths instead. It runs from a scratch directory so the checkout
      # (needed only for the script itself) cannot stand in for the
      # installed package; the script refuses that case explicitly.

      - name: Test the sdist
        run: |
          python -m venv venv-sdist
          venv-sdist/bin/python -m pip install dist/vaibify*.tar.gz
          mkdir -p "${RUNNER_TEMP}/sdist-check" && cd "${RUNNER_TEMP}/sdist-check"
          PATH="${GITHUB_WORKSPACE}/venv-sdist/bin:${PATH}" \
            "${GITHUB_WORKSPACE}/venv-sdist/bin/python" \
            "${GITHUB_WORKSPACE}/tools/checkInstalledDistribution.py"

      - name: Test the wheel
        run: |
          python -m venv venv-wheel
          venv-wheel/bin/python -m pip install dist/vaibify*.whl
          mkdir -p "${RUNNER_TEMP}/wheel-check" && cd "${RUNNER_TEMP}/wheel-check"
          PATH="${GITHUB_WORKSPACE}/venv-wheel/bin:${PATH}" \
            "${GITHUB_WORKSPACE}/venv-wheel/bin/python" \
            "${GITHUB_WORKSPACE}/tools/checkInstalledDistribution.py"

  upload_pypi:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

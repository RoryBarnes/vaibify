name: browser

# The frontend, executed in a real browser.
#
# Until this job existed, ~30,000 lines of JavaScript were verified by
# nothing: no runner, no linter, no type check, and no CI workflow that
# so much as mentioned a .js file. The only guard was a manual browser
# checklist in AGENTS.md that a delegated agent physically cannot
# follow, and a branch once merged fully green with the frontend
# entirely unexecuted.
#
# ONE cell on purpose -- Linux, one Python, Chromium. A browser journey
# does not become more trustworthy by running 24 times across the
# OS/Python matrix; it becomes slower.
#
# This lane does NOT speak for the Docker boundary. It drives a
# fail-closed fake adapter, and the container acceptance lane is what
# proves a real container answers the same way. This lane failing
# blocks merge; container acceptance blocks the next release.

on:
  # NO base-branch filter, deliberately. These gates were declared
  # `branches: [main]`, so a pull request based on another branch --
  # a stacked PR, which is how a large feature gets reviewed in
  # pieces -- triggered NONE of them and reported "no checks" rather
  # than failing. That reads almost exactly like "all checks passed"
  # on a PR page, and it hid an entire feature branch from CI on
  # 2026-08-18. A gate that does not run is worse than a gate that
  # fails, because only one of them says so.
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    # The job name IS the status-check name, and the status-check name is
    # what you search for when adding a required check. Called "frontend
    # (chromium)", this lane was unfindable by anyone typing "browser" —
    # so it silently stayed out of the required set while appearing to
    # gate every pull request.
    name: 'browser'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser]"

      - name: Install Chromium
        # BOUNDED. --with-deps shells out to apt, and on 2026-08-18 this
        # step sat for one hour forty-four minutes on a runner whose
        # package fetch never returned -- against a lane that normally
        # finishes end to end in four. Nothing below it could hang like
        # that, because every step below it is bounded; this one was the
        # only unbounded step in the job, so the run reported nothing at
        # all while looking busy, and would have kept doing so until
        # GitHub's six-hour job ceiling. An unbounded setup step in front
        # of a bounded test is the same false-green shape as `docker info
        # || exit 0`: the check cannot say what it did not do.
        timeout-minutes: 8
        run: python -m playwright install --with-deps chromium

      - name: Run the browser lane
        timeout-minutes: 10
        env:
          # Turns the "playwright not installed" skip into a failure.
          # A browser job that goes green without a browser is the same
          # false green the docker-smoke guard used to ship.
          VAIBIFY_REQUIRE_BROWSER: '1'
        run: |
          python -m pytest tests/browser -m browser --tb=short -v

      # Trace, video, screenshot and console log are written by the
      # pageDashboard fixture itself, not by pytest-playwright's
      # --tracing/--video options: those live in the plugin's own
      # context fixture, which this lane does not use, so passing them
      # here produced an empty directory and a confident upload step.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-lane-failure
          path: test-results/
          # NOT 'ignore'. A failed browser run with no trace means the
          # artifact plumbing broke, and that must be visible rather
          # than silently uploading nothing.
          if-no-files-found: error

name: agent-docs-path-check

on:
  # NO base-branch filter, deliberately. These gates were declared
  # `branches: [main]`, so a pull request based on another branch --
  # a stacked PR, which is how a large feature gets reviewed in
  # pieces -- triggered NONE of them and reported "no checks" rather
  # than failing. That reads almost exactly like "all checks passed"
  # on a PR page, and it hid an entire feature branch from CI on
  # 2026-08-18. A gate that does not run is worse than a gate that
  # fails, because only one of them says so.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede, do not pile up. Every push to an open pull request used to
# queue another full matrix behind the last one, and nothing cancelled
# the run it had just made irrelevant. On the macOS legs -- the
# scarcest runners and the widest matrix -- that meant twelve unit jobs
# sitting at QUEUED for two hours while a superseded run from the
# previous push held the machines (2026-09-21).
#
# Keyed on the PULL REQUEST, so two different PRs never contend, and
# cancelling is switched off for anything that is not a pull request:
# a push to main and a manual dispatch are results somebody wants, not
# drafts to be replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  path-check:
    name: 'agent-docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify referenced paths exist
        run: python tools/checkAgentDocsPaths.py

name: browser-chromium

# The frontend, executed in a real browser.
#
# Until this job existed, ~30,000 lines of JavaScript were verified by
# nothing: no runner, no linter, no type check, and no CI workflow that
# so much as mentioned a .js file. The only guard was a manual browser
# checklist in AGENTS.md that a delegated agent physically cannot
# follow, and a branch once merged fully green with the frontend
# entirely unexecuted.
#
# CHROMIUM. Firefox and WebKit have their own workflow files,
# browser-firefox.yml and browser-webkit.yml, and the split is not
# cosmetic: a GitHub status badge addresses a WORKFLOW FILE, not a job,
# so a matrix inside this one could never give either engine a badge of
# its own. One file per engine is what makes each answerable from the
# README at a glance.
#
# Still one cell of OS and Python, deliberately. A browser journey does
# not become more trustworthy by running 24 times across the OS/Python
# matrix; it becomes slower. A second ENGINE is the opposite trade --
# it executes genuinely different code. The lane ran Chromium alone
# until 2026-09-16, when a terminal defect was reported by a researcher
# whose daily browser is Firefox and could not be reproduced here at
# all.
#
# This job KEEPS ITS NAME. It is the required check, and renaming it to
# "browser (chromium)" would have silently removed that check while
# every pull request still showed a green browser lane. Add
# "browser-firefox" and "browser-webkit" to the required set for the
# other two to gate as well.
#
# Chromium ALSO runs the five clipboardPermissions tests, which
# Playwright can only grant in this engine; the other two deselect
# them.
#
# This lane does NOT speak for the Docker boundary. It drives a
# fail-closed fake adapter, and the container acceptance lane is what
# proves a real container answers the same way. This lane failing
# blocks merge; container acceptance blocks the next release.

on:
  # NO base-branch filter, deliberately. These gates were declared
  # `branches: [main]`, so a pull request based on another branch --
  # a stacked PR, which is how a large feature gets reviewed in
  # pieces -- triggered NONE of them and reported "no checks" rather
  # than failing. That reads almost exactly like "all checks passed"
  # on a PR page, and it hid an entire feature branch from CI on
  # 2026-08-18. A gate that does not run is worse than a gate that
  # fails, because only one of them says so.
  pull_request:
  workflow_dispatch:

jobs:
  browser-chromium:
    # The job name IS the status-check name, and the status-check name is
    # what you search for when adding a required check. Called "frontend
    # (chromium)", this lane was unfindable by anyone typing "browser" —
    # so it silently stayed out of the required set while appearing to
    # gate every pull request.
    #
    # Renamed from 'browser' to 'browser-chromium' on 2026-09-16, when
    # the sibling engines arrived and a bare "browser" stopped saying
    # which one it drove. A rename retires the OLD required check: add
    # 'browser-chromium' to the required set and drop 'browser', or
    # nothing gates the frontend at all.
    name: 'browser-chromium'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser]"

      - name: Install Chromium
        # BOUNDED. --with-deps shells out to apt, and on 2026-08-18 this
        # step sat for one hour forty-four minutes on a runner whose
        # package fetch never returned -- against a lane that normally
        # finishes end to end in four. Nothing below it could hang like
        # that, because every step below it is bounded; this one was the
        # only unbounded step in the job, so the run reported nothing at
        # all while looking busy, and would have kept doing so until
        # GitHub's six-hour job ceiling. An unbounded setup step in front
        # of a bounded test is the same false-green shape as `docker info
        # || exit 0`: the check cannot say what it did not do.
        #
        # AND IT FETCHES NOTHING FROM apt UNLESS IT HAS TO. The bound
        # above turned the hang into a fast failure, which is the guard
        # working -- but it kept firing, because the mirror kept being
        # unreachable, and a lane that cannot run is a lane that says
        # nothing. `--with-deps` is a blanket `apt-get install` of the
        # OS libraries Chromium links against, and the ubuntu-24.04
        # runner image already ships Chrome and Edge, so those libraries
        # are already there. The browser binary itself comes from
        # Playwright's CDN, which is a different host and was never the
        # problem.
        #
        # The fallback is not optional and the probe is not decoration:
        # dropping the apt step on the assumption that the image is
        # sufficient would be exactly the unverified claim this
        # repository keeps getting bitten by. So launch the browser and
        # let it answer. If it cannot start, fetch the dependencies and
        # make it answer again -- and if it still cannot, fail here,
        # where the cause is legible, rather than as twenty confusing
        # test errors.
        timeout-minutes: 8
        run: |
          python -m playwright install chromium
          if python tools/checkBrowserLaunches.py chromium; then
            echo "Chromium launches against the runner image's own libraries."
            exit 0
          fi
          echo "Chromium did not launch; fetching its OS dependencies."
          python -m playwright install-deps chromium
          python tools/checkBrowserLaunches.py chromium

      - name: Run the browser lane
        # 10 -> 15 on 2026-09-08, with the researcher's approval. The
        # lane had grown to its ceiling on its own: a run finished all
        # 299 tests, every one passing, four seconds PAST ten minutes,
        # and the step failed for having done the whole job. A lane
        # that reports failure for finishing says nothing about the
        # frontend, which is the same class as a lane that skips
        # itself green -- and at nine minutes fifty the next browser
        # test anyone adds tips it again. Raise this rather than
        # trimming tests when it next gets close; the honest reason to
        # cut a browser test is that it proves nothing, never that the
        # clock is short.
        #
        # 15 -> 25 on 2026-09-16, with the researcher's approval, under
        # that same rule. The note above was written against 299 tests;
        # collection now reports 365, and the lane had no more headroom
        # than it did the last time this was raised. 25 matches the
        # engines job, so no browser check fails for the sole offence
        # of finishing its work.
        timeout-minutes: 25
        env:
          # Turns the "playwright not installed" skip into a failure.
          # A browser job that goes green without a browser is the same
          # false green the docker-smoke guard used to ship.
          VAIBIFY_REQUIRE_BROWSER: '1'
        run: |
          python -m pytest tests/browser -m browser --tb=short -v

      # Trace, video, screenshot and console log are written by the
      # pageDashboard fixture itself, not by pytest-playwright's
      # --tracing/--video options: those live in the plugin's own
      # context fixture, which this lane does not use, so passing them
      # here produced an empty directory and a confident upload step.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-lane-failure
          path: test-results/
          # NOT 'ignore'. A failed browser run with no trace means the
          # artifact plumbing broke, and that must be visible rather
          # than silently uploading nothing.
          if-no-files-found: error

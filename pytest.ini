[pytest]
testpaths = tests
python_files = test*.py
markers =
    docker: tests that require a running Docker daemon
    docker_live: smoke tests against a live local Docker daemon (CI-opt-in)
    dockerProbeUnderTest: a unit test OF the docker status probes
        themselves. Exempt from conftest's stub of those probes --
        it patches subprocess itself, so it needs no daemon, but it
        does need the real function under test.
    browser: Lane 1 — real Chromium against a real uvicorn hub. Needs
        Playwright (`pip install -e '.[browser]'` then
        `python -m playwright install chromium`). Excluded from the
        ordinary matrix; its own CI job runs it on one Linux/Python cell.
    exclusive: this test holds a MACHINE-GLOBAL resource -- a bound
        port, a unix socket, a real hub process -- so two of them on
        one machine contend even when each has its own source tree.
        The re-kill harness runs these in a lane of their own, never
        under its parallel workers. Applied per FILE, because the
        resource belongs to the fixture that spins it up, and enforced
        by testFalsificationSharding: a file that binds a port and
        forgets the marker fails the build rather than flaking later.
    realCouncilStoreRoot: a test OF the durable council store root
        resolver itself. Exempt from conftest's isolation of that
        resolver — every other test is kept away from the researcher's
        real store, because building a hub there interrupts their live
        council.
    councilCapacity: a test OF the council's machine-scaled snapshot
        bounds. Exempt from conftest's pin of the host-memory reading,
        which every other test needs so that a bound assertion does not
        silently become an assertion about the developer's RAM.
    falsification: a kill-confirmed test born from mutation testing — it
        was proven to FAIL when the specific guard it defends is broken,
        not merely to pass. Its docstring records the killed mutation on a
        "Kills:" line. Run the class with `pytest -m falsification`.
